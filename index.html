<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>绝区零 - UI界面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .header {
            background-color: #2c2c2c;
            padding: 10px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            display: flex;
            height: calc(100vh - 50px);
        }
        .sidebar {
            background-color: #2c2c2c;
            width: 20%;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar li {
            margin: 15px 0;
            padding: 10px;
            background-color: #3a3a3a;
            text-align: center;
            cursor: pointer;
        }
        .sidebar li:hover {
            background-color: #575757;
        }
        .content {
            width: 80%;
            padding: 20px;
            box-sizing: border-box;
        }
        .status-bar {
            display: flex;
            justify-content: space-around;
            background-color: #3a3a3a;
            padding: 15px 0;
            margin-bottom: 20px;
        }
        .status-bar div {
            width: 30%;
            text-align: center;
        }
        .status-bar .health-bar,
        .status-bar .energy-bar {
            background-color: #4c4c4c;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .status-bar .health-bar .fill,
        .status-bar .energy-bar .fill {
            height: 100%;
            background-color: #e74c3c; /* 红色表示生命条 */
            width: 70%; /* 代表当前的生命值或能量 */
            position: absolute;
            left: 0;
            top: 0;
        }
        .status-bar .energy-bar .fill {
            background-color: #3498db; /* 蓝色表示能量条 */
            width: 50%; /* 代表当前的能量值 */
        }
    </style>
</head>
<body>

    <!-- 页头 -->
    <header class="header">
        <h1>绝区零 - 游戏界面</h1>
    </header>

    <!-- 主体内容 -->
    <div class="container">

        <!-- 侧边栏 -->
        <nav class="sidebar">
            <ul>
                <li>角色信息</li>
                <li>装备</li>
                <li>技能</li>
                <li>任务</li>
                <li>设置</li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="content">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="health-bar">
                    <div class="fill"></div>
                    <p>生命值</p>
                </div>
                <div class="energy-bar">
                    <div class="fill"></div>
                    <p>能量</p>
                </div>
                <div class="other-stats">
                    <p>等级: 5</p>
                    <p>经验值: 200/500</p>
                </div>
            </div>

            <section class="game-content">
                <h2>当前任务：探索废墟</h2>
                <p>你需要深入敌占区，寻找失踪的科学家并带回关键数据。</p>
                <p>敌人强大且数量众多，请做好战斗准备。</p>
            </section>
        </main>
    </div>

</body>
</html>
